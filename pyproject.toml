[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deutero"
version = "0.2.0"
description = "Python SDK for Deutero: run AI moderated interviews and qualitative interviewing at scale for user research, from study design and recruitment to transcript analysis."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Deutero", email = "support@deutero.ai" }]
keywords = [
    "deutero",
    "ai-moderated-interviews",
    "ai-interviewer",
    "qualitative-interviewing",
    "qualitative-research",
    "user-research",
    "ux-research",
    "customer-interviews",
    "interviews",
    "thematic-analysis",
    "sdk",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.25.0,<1.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "respx>=0.21",
    "standardwebhooks>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://deutero.ai"
Documentation = "https://docs.deutero.ai"
Repository = "https://github.com/deutero-ai/deutero-python"
Issues = "https://github.com/deutero-ai/deutero-python/issues"
Changelog = "https://github.com/deutero-ai/deutero-python/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/deutero"]

[tool.hatch.build.targets.sdist]
include = ["src/deutero", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.9"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
